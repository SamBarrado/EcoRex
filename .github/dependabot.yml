version: 2

# Monthly, minors and patches only. Majors are upgraded by hand when wanted;
# security updates are not affected by these limits.
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/push-cron
    schedule:
      interval: monthly
      time: "08:00"
      timezone: Europe/Madrid
    # Skip releases younger than a week. Security updates ignore this delay.
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    # A single pull request for everything.
    groups:
      monthly:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
