version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /workers/push-cron
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    # Skip releases younger than a week. Security updates ignore this delay.
    cooldown:
      default-days: 7
    # A dependency joins the first group it matches.
    groups:
      # Wrangler minor releases can require a new major of the Workers types.
      cloudflare:
        patterns:
          - wrangler
          - "@cloudflare/*"
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # jest-dom majors are tied to Vitest majors.
      testing:
        patterns:
          - vitest
          - "@vitest/*"
          - jsdom
          - "@testing-library/*"
      # Everything else: one PR for minors and patches, one per major.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
